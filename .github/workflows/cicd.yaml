name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build backend image
      run: |
        docker build -t vikashl10/mongo-k8s-backend:latest \
          -t vikashl10/mongo-k8s-backend:${{ github.sha }} \
          -f backend.Dockerfile .

    - name: Build frontend image
      run: |
        docker build -t vikashl10/mongo-k8s-frontend:latest \
          -t vikashl10/mongo-k8s-frontend:${{ github.sha }} \
          -f frontend.Dockerfile .

    - name: Push backend image
      run: |
        docker push vikashl10/mongo-k8s-backend:latest
        docker push vikashl10/mongo-k8s-backend:${{ github.sha }}

    - name: Push frontend image
      run: |
        docker push vikashl10/mongo-k8s-frontend:latest
        docker push vikashl10/mongo-k8s-frontend:${{ github.sha }}


  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy notification
      run: |
        echo "✅ Images built and pushed successfully!"
        echo "🐳 Backend: vikashl10/mongo-k8s-backend:${{ github.sha }}"
        echo "🎨 Frontend: vikashl10/mongo-k8s-frontend:${{ github.sha }}"
        echo "☸️ In production: kubectl apply -f k8s/ to deploy"